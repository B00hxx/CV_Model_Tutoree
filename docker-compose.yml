# GPU needs the NVIDIA Container Toolkit (already works with Docker Desktop + WSL2).
#   docker compose run --rm train
#   docker compose run --rm evaluate
#   docker compose run --rm predict data/gtsrb/Test/00000.png data/gtsrb/Test/00001.png
x-common: &common
  build: .
  image: gtsrb-cnn:latest
  user: "${UID:-1000}:${GID:-1000}"   # outputs/ files owned by you, not root
  shm_size: "4gb"                      # DataLoader workers share batches through /dev/shm
  volumes:
    - ./archive:/app/data/gtsrb:ro
    - ./outputs:/app/outputs
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  train:
    <<: *common
    entrypoint: ["python", "train.py"]
  evaluate:
    <<: *common
    entrypoint: ["python", "evaluate.py"]
  predict:
    <<: *common
    entrypoint: ["python", "predict.py"]
